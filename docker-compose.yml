services:
  hue-tourism-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7151:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: hue_tourism_redis
    ports:
      - "6379:6379"
    restart: always